name: game-insight

# Start everything with:  docker compose up --build
# Settings come from an optional .env file (see .env.example); the defaults below
# are for local development only.

x-app: &app
  image: game-insight-app
  build:
    context: .
    target: app
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-game_insight}:${POSTGRES_PASSWORD:-game_insight}@db:5432/${POSTGRES_DB:-game_insight}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    RAWG_API_KEY: ${RAWG_API_KEY:-}
    IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
    IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_DISABLE_AGENT_HINT: "1"
    GIT_PYTHON_REFRESH: quiet  # no git in the image; MLflow just skips commit tagging
    STEAM_REQUEST_INTERVAL: ${STEAM_REQUEST_INTERVAL:-1.5}
    ML_MIN_TRAINING_ROWS: ${ML_MIN_TRAINING_ROWS:-200}
    MODEL_REFRESH_SECONDS: ${MODEL_REFRESH_SECONDS:-60}
    SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpass}
    # Dashboard sign-in: Rauthy's issuer as the browser sees it (through the frontend).
    OIDC_ISSUER: http://localhost:${FRONTEND_PORT:-8080}/auth/v1/
    OIDC_JWKS_URL: http://rauthy:8080/auth/v1/oidc/certs
    USE_ALEMBIC: "1"
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_insight}
      POSTGRES_DB: ${POSTGRES_DB:-game_insight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies the Alembic migrations, then exits.
  migrate:
    <<: *app
    command: alembic -c src/backend/alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: on an empty database, loads the bundled sample (data/raw/games.csv,
  # about 16,500 games) so the dashboard and the model have data before any live ingestion.
  # Load every CSV instead with:  docker compose run --rm seed python -m src.scripts.seed_from_csv
  seed:
    <<: *app
    command: python -m src.scripts.seed_from_csv --if-empty games.csv
    environment:
      <<: *app-env
      DATA_DIR: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # MLflow tracking server and model registry. Runs and registered models live in their
  # own "mlflow" database on the same Postgres server; artifacts in a volume, served
  # over HTTP (--serve-artifacts) so clients need no shared filesystem.
  mlflow:
    image: game-insight-mlflow
    build:
      context: .
      target: mlflow
    command:
      - sh
      - -c
      - >-
        python -m src.scripts.ensure_database "$$MLFLOW_BACKEND_STORE_URI" &&
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --serve-artifacts --artifacts-destination /mlflow/artifacts
        --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:-game_insight}:${POSTGRES_PASSWORD:-game_insight}@db:5432/mlflow
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot: trains the Metacritic model on the seeded data, logs it to MLflow and
  # promotes it to "champion" if it beats the current one. Retrain any time with
  #   docker compose run --rm train
  train:
    <<: *app
    command: python -m src.ml.train
    depends_on:
      seed:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: celery -A src.backend.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.backend.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  flower:
    <<: *app
    command: celery -A src.backend.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy

  # One-shot: writes Rauthy's bootstrap files with the dashboard's real port filled in
  # (redirect URIs must match exactly). Rauthy reads them only when its database is empty.
  rauthy-bootstrap:
    image: busybox:1.37
    command:
      - sh
      - -c
      - sed "s/__FRONTEND_PORT__/$${FRONTEND_PORT}/g" /src/clients.json > /out/clients.json
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
    volumes:
      - ./deploy/rauthy/clients.json:/src/clients.json:ro
      - rauthy_bootstrap:/out
    restart: "no"

  # Rauthy: OpenID Connect provider for dashboard sign-in and registration. The browser
  # reaches it through nginx under /auth/, so the issuer is
  # http://localhost:${FRONTEND_PORT}/auth/v1 and everything stays on one origin.
  # Admin UI: http://localhost:${FRONTEND_PORT}/auth/v1/admin
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2
    environment:
      LISTEN_SCHEME: http
      LISTEN_PORT_HTTP: "8080"
      PUB_URL: localhost:${FRONTEND_PORT:-8080}
      # Rauthy assumes HTTPS in proxy mode, so it runs as if reached directly; nginx only
      # forwards the path. Its rate limits then see nginx's address, acceptable locally.
      PROXY_MODE: "false"
      # Plain-HTTP cookies: fine on localhost, never behind a public URL.
      COOKIE_MODE: danger-insecure
      RP_ID: localhost
      RP_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      OPEN_USER_REG: "true"
      ADMIN_FORCE_MFA: "false"
      HTTP_WORKERS: "1"
      HQL_NODE_ID: "1"
      HQL_NODES: "1 localhost:8100 localhost:8200"
      HQL_DATA_DIR: /app/data
      HQL_SECRET_RAFT: ${RAUTHY_SECRET_RAFT:-dev-only-raft-secret-change-me}
      HQL_SECRET_API: ${RAUTHY_SECRET_API:-dev-only-api-secret-change-me}
      ENC_KEYS: ${RAUTHY_ENC_KEYS:-devonly/e6GPTA+a9CbMXmHNlnUElTUxXB2rNZWim5tjYzg8XPw=}
      ENC_KEY_ACTIVE: ${RAUTHY_ENC_KEY_ACTIVE:-devonly}
      BOOTSTRAP_DIR: /app/bootstrap
      BOOTSTRAP_ADMIN_EMAIL: ${RAUTHY_ADMIN_EMAIL:-admin@localhost}
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: ${RAUTHY_ADMIN_PASSWORD:-DevOnlyAdminPassword1!}
      # Registration and password-reset mail goes to the mail catcher below.
      SMTP_URL: mailcrab
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: danger-insecure
      SMTP_FROM: Game Insight <auth@localhost>
    volumes:
      - rauthy_data:/app/data
      - rauthy_bootstrap:/app/bootstrap:ro
    depends_on:
      rauthy-bootstrap:
        condition: service_completed_successfully
      mailcrab:
        condition: service_started
    restart: unless-stopped

  # Catches Rauthy's e-mails (registration, password reset). Inbox: http://localhost:8025
  mailcrab:
    image: marlonb/mailcrab:v1.6.2
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:1080"
    restart: unless-stopped

  # React dashboard (frontend/). nginx serves the build, proxies /api to the backend and
  # /auth to Rauthy.
  frontend:
    image: game-insight-frontend
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      rauthy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Opt-in: queues RAWG ingestion for every month since 1980 (needs RAWG_API_KEY).
  #   docker compose --profile backfill run --rm backfill [START_YEAR] [END_YEAR]
  backfill:
    <<: *app
    profiles: ["backfill"]
    entrypoint: ["python", "-m", "src.scripts.backfill_data"]
    command: []
    depends_on:
      worker:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  mlflow_artifacts:
  rauthy_data:
  rauthy_bootstrap:
