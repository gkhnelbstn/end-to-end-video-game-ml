server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; resolving at request time lets nginx start before the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets never change; cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/games/123, /stats, ...) all serve the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
